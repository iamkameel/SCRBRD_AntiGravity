# Match lifecycle and core entity queries

query ListPeople @auth(level: PUBLIC) {
  people {
    id
    firstName
    lastName
    preferredName
    email
    phone
    profileImageUrl
    status
    # Join roles through UserAccount
    userAccount_on_person {
      userRoleAssignments_on_userAccount {
        id
        systemRole {
          label
        }
        organisation {
          id
          name
        }
      }
    }
  }
}

query GetPerson($id: UUID!) @auth(level: PUBLIC) {
  person(id: $id) {
    id
    firstName
    lastName
    preferredName
    email
    phone
    profileImageUrl
    status
    userAccount_on_person {
      userRoleAssignments_on_userAccount {
        id
        systemRole {
          label
        }
        organisation {
          id
          name
        }
      }
    }
  }
}

query ListFixtures @auth(level: PUBLIC) {
  fixtures {
    id
    scheduledStartAt
    homeTeam {
      id
      name
      organisation {
        id
        name
      }
    }
    awayTeam {
      id
      name
      organisation {
        id
        name
      }
    }
    venue {
      id
      name
    }
    status
  }
}

query ListOrganisations @auth(level: PUBLIC) {
  organisations {
    id
    name
    organisationType
    shortName
    slug
    logoUrl
  }
}

query ListVenues @auth(level: PUBLIC) {
  venues {
    id
    name
    venueType
    organisation {
      id
      name
    }
  }
}

query ListSeasons @auth(level: PUBLIC) {
  seasons {
    id
    name
    startDate
    endDate
    isActive
  }
}

query ListAgeDivisions @auth(level: PUBLIC) {
  ageDivisions {
    id
    name
    minAge
    maxAge
  }
}

query ListTeamClasses @auth(level: PUBLIC) {
  teamClasses {
    id
    code
    label
  }
}

query ListTeams @auth(level: PUBLIC) {
  teams {
    id
    name
    displayName
    shortName
    organisation {
      id
      name
    }
    season {
      id
      name
    }
    ageDivision {
      id
      name
    }
    teamClass {
      id
      label
      code
    }
  }
}

# --- Intelligence & Rankings Layer ---

query GetPlayerIntelligence($personId: UUID!) @auth(level: PUBLIC) {
  person(id: $personId) {
    id
    firstName
    lastName
    playerProfile_on_person {
      id
      preferredRole
      battingStyle
      bowlingStyle
      profileStatus
      playerIdCode
    }
    skillRatings_on_person(orderBy: [{ratedAt: DESC}]) {
      id
      category
      attributeName
      ratingValue
      notes
      ratedAt
    }
  }
  rankingSnapshots(where: {
    entityId: {eq: $personId},
    entityType: {eq: "Person"}
  }, orderBy: [{computedAt: DESC}]) {
    id
    rankingType
    score
    rank
    previousRank
    movement
    confidence
    computedAt
    rankingComponents_on_rankingSnapshot {
      componentName
      rawValue
      normalisedValue
      weight
      contribution
    }
  }
}

query GetEcosystemOverview @auth(level: PUBLIC) {
  schoolRankings: rankingSnapshots(where: {
    entityType: {eq: "School"},
    rankingType: {eq: "TeamRank"}
  }, orderBy: [{score: DESC}], limit: 10) {
    id
    entityId
    score
    rank
    movement
  }
  playerRankings: rankingSnapshots(where: {
    entityType: {eq: "Person"},
    rankingType: {eq: "PlayerPower"}
  }, orderBy: [{score: DESC}], limit: 10) {
    id
    entityId
    score
    rank
    movement
  }
}
